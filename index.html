<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main">

        <div class="parent-box">
                
                    <div class="left-side">
                        <img src="./google-logo-removebg-preview.png" alt="">
                        <p id="txt1">Sign in</p>
                        <p id="txt2">with your Google Account. This account will be available to other Google apps in the browser.</p>
                    </div>

                    <div class="right-side">
                        <input type="email" placeholder="Email or phone">
                        <a href="#" id="l1">Forgot email?</a>
                        <p>Not your computer? Use Guest mode to sign in privately. <a href="#" id="l2"> Learn more about using Guest mode</a></p>
                        
                        <div class="btns">
                        <button id="btn-create">Create account</button>
                        <button id="btn-next">Next</button>
                        </div>
                    </div>
                
        </div>
