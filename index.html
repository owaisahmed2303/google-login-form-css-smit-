<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main">

        <div class="parent-box">

            <div class="left-side">
                <img src="./google-logo.jpg" alt="" id="logo">
                <p id="left-text1">Sign in</p> 
                <p id="left-text2">with your Google Account.This account will be available to other Google apps in the browser.</p>
            </div>

            <div class="right-side">
                <input type="email" placeholder="Email or phone" id="in1">
                <a href="#">Forgot email?</a>
                <p id="right-text1">Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more about using Guest mode</a> </p>
              
                <div class="buttons">
                <a href="#" id="create-link">Create account</a>
                <button>Next</button>
                </div>
            </div>
            

        </div>
    </div>
</body>
</html>
